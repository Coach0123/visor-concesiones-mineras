name: Monitoreo de Concesiones Mineras

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  monitoreo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v3
        
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Instalar dependencias
        run: npm install
        
      - name: Instalar GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin
        
      - name: Descargar shapefiles
        run: node scripts/descargar-shapefiles.js
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          
      - name: Ejecutar script de actualización
        run: node scripts/actualizar-shapefiles.js
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          
      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/*.geojson data/cambios.json data/ultima_limpieza.json
          git commit -m "Actualizar automático - $(date +'%Y-%m-%d %H:%M')" || echo "No hay cambios para commit"
          git push