name: Actualizar Datos Mineros

on:
  schedule:
    # Ejecutar cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Instalar dependencias
        run: npm install adm-zip fs-extra node-fetch shapefile
        
      - name: Ejecutar script de actualización
        run: node scripts/actualizar-shapefiles.js
        continue-on-error: true
        
      - name: Verificar y subir cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Forzar adición de archivos nuevos
          git add -f data/ || true
          
          # Verificar si hay cambios
          if git diff --cached --quiet; then
            echo "✅ No hay cambios nuevos. Saliendo sin errores."
            exit 0
          fi
          
          # Mostrar archivos a commitear
          echo "📦 Archivos a commitear:"
          git diff --cached --name-only || true
          
          # Hacer commit y push (con manejo de errores)
          git commit -m "Actualización automática $(date +'%d%m%y_%H%M')" || echo "No hay cambios para commit"
          git pull --rebase origin main || echo "Pull falló, continuando..."
          git push || echo "Push falló, puede que no haya cambios"
          
          echo "✅ Proceso completado"